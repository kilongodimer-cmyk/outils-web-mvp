<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter & Validator — Outil Web Gratuit</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-950 min-h-screen flex flex-col justify-between">
    <header class="p-4 border-b border-slate-200 bg-white sticky top-0 z-30">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="/" class="text-sm font-medium text-indigo-600 hover:underline flex items-center gap-1">← Retour à l'accueil</a>
            <span class="text-xs font-mono text-slate-400">/json-formatter/</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full p-4 sm:p-6 my-auto">
        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 mb-1">JSON Formatter & Validator</h1>
            <p class="text-sm text-slate-600">Formatez, validez et minifiez vos données JSON instantanément dans votre navigateur.</p>
        </div>

        <!-- Garantie de confidentialité -->
        <div class="mb-6 p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 flex items-center gap-2">
            <span class="font-bold">🔒 Sécurité :</span> Traitement 100% local dans votre navigateur (aucune donnée envoyée à un serveur).
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <!-- Entrée -->
            <div class="flex flex-col">
                <label for="json-input" class="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">JSON d'entrée</label>
                <textarea id="json-input" rows="12" placeholder='Collez votre JSON ici ex: {"nom": "Alice"}' class="w-full p-3 font-mono text-xs bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-y"></textarea>
            </div>
            <!-- Résultat -->
            <div class="flex flex-col">
                <label for="json-output" class="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Résultat / Sortie</label>
                <textarea id="json-output" rows="12" readonly placeholder="Le résultat formaté ou minifié apparaîtra ici..." class="w-full p-3 font-mono text-xs bg-slate-100 border border-slate-300 rounded-xl focus:outline-none resize-y"></textarea>
            </div>
        </div>

        <!-- Boutons d'action -->
        <div class="flex flex-wrap gap-2 mb-4">
            <button id="btn-format" class="px-4 py-2.5 bg-indigo-600 text-white font-medium text-sm rounded-xl hover:bg-indigo-700 transition cursor-pointer">✨ Formater</button>
            <button id="btn-minify" class="px-4 py-2.5 bg-slate-800 text-white font-medium text-sm rounded-xl hover:bg-slate-900 transition cursor-pointer">🗜️ Minifier</button>
            <button id="btn-copy" class="px-4 py-2.5 bg-white border border-slate-300 text-slate-700 font-medium text-sm rounded-xl hover:bg-slate-50 transition cursor-pointer">📋 Copier</button>
            <button id="btn-clear" class="px-4 py-2.5 bg-white border border-slate-300 text-rose-600 font-medium text-sm rounded-xl hover:bg-rose-50 transition cursor-pointer ml-auto">🗑️ Effacer</button>
        </div>

        <!-- Zone de message / Erreur -->
        <div id="status-message" class="p-3 rounded-xl text-xs font-medium hidden"></div>
    </main>

    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-200 mt-10">
        <a href="/" class="hover:underline">Accueil</a>
    </footer>

    <script>
        const input = document.getElementById('json-input');
        const output = document.getElementById('json-output');
        const statusMsg = document.getElementById('status-message');

        function showStatus(text, type) {
            statusMsg.textContent = text;
            statusMsg.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border', 'border-emerald-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200');
            if (type === 'success') {
                statusMsg.classList.add('bg-emerald-50', 'text-emerald-800', 'border', 'border-emerald-200');
            } else {
                statusMsg.classList.add('bg-rose-50', 'text-rose-800', 'border', 'border-rose-200');
            }
        }

        document.getElementById('btn-format').addEventListener('click', () => {
            try {
                if (!input.value.trim()) {
                    output.value = '';
                    statusMsg.classList.add('hidden');
                    return;
                }
                const parsed = JSON.parse(input.value);
                output.value = JSON.stringify(parsed, null, 2);
                showStatus('✓ JSON valide et formaté avec succès.', 'success');
            } catch (e) {
                showStatus(`❌ Erreur de syntaxe JSON : ${e.message}`, 'error');
            }
        });

        document.getElementById('btn-minify').addEventListener('click', () => {
            try {
                if (!input.value.trim()) return;
                const parsed = JSON.parse(input.value);
                output.value = JSON.stringify(parsed);
                showStatus('✓ JSON minifié avec succès.', 'success');
            } catch (e) {
                showStatus(`❌ Erreur de syntaxe JSON : ${e.message}`, 'error');
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            input.value = '';
            output.value = '';
            statusMsg.classList.add('hidden');
            input.focus();
        });

        document.getElementById('btn-copy').addEventListener('click', () => {
            if (!output.value) return;
            navigator.clipboard.writeText(output.value);
            const btn = document.getElementById('btn-copy');
            const originalText = btn.textContent;
            btn.textContent = '✓ Copié !';
            setTimeout(() => btn.textContent = originalText, 2000);
        });
    </script>
</body>
</html>
